<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文绎新堂——课文双端数字实践项目</title>
<meta name="description" content="文绎新堂——课文双端数字实践项目：高校新文科跨专业学生实践团队，坚持人文考据为先、AI技术赋能，面向中小学美育、县域文博文旅、青年新媒体传播三大场景开展传统文化数字化实践。">
<style>
@font-face {
  font-family: 'InstrumentSerif';
  src: url('./_shared/fonts/InstrumentSerif-Regular.ttf') format('truetype');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'InstrumentSerif';
  src: url('./_shared/fonts/InstrumentSerif-Italic.ttf') format('truetype');
  font-weight: 400;
  font-style: italic;
  font-display: swap;
}
@font-face {
  font-family: 'InstrumentSans';
  src: url('./_shared/fonts/InstrumentSans-Regular.ttf') format('truetype');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'InstrumentSans';
  src: url('./_shared/fonts/InstrumentSans-Bold.ttf') format('truetype');
  font-weight: 700;
  font-display: swap;
}
@font-face {
  font-family: 'CrimsonPro';
  src: url('./_shared/fonts/CrimsonPro-Regular.ttf') format('truetype');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'CrimsonPro';
  src: url('./_shared/fonts/CrimsonPro-Bold.ttf') format('truetype');
  font-weight: 700;
  font-display: swap;
}

:root {
  --bg: #FBF7F1;
  --bg2: #F4EDE0;
  --ink: #2B2118;
  --muted: #8B7B6A;
  --rule: #E0D5C2;
  --accent: #9B2D20;
  --accent2: #C4A35A;
  --accent-light: rgba(155, 45, 32, 0.08);
  --gold-light: rgba(196, 163, 90, 0.12);
  --serif: 'InstrumentSerif', 'Songti SC', 'STSong', 'Noto Serif SC', serif;
  --serif-alt: 'CrimsonPro', 'Songti SC', 'STSong', 'Noto Serif SC', serif;
  --sans: 'InstrumentSans', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --shadow: 0 4px 24px rgba(43, 33, 24, 0.06);
  --shadow-lg: 0 8px 40px rgba(43, 33, 24, 0.10);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  overflow-x: hidden;
}
img { max-width: 100%; height: auto; display: block; }
a { color: var(--accent); text-decoration: none; }
ul { list-style: none; }
.container { max-width: 1140px; margin: 0 auto; padding: 0 24px; }

h1, h2, h3, h4 { font-family: var(--serif); font-weight: 400; line-height: 1.25; }
p { font-size: 1rem; color: var(--ink); }

/* === HERO === */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 80px 0 60px;
  perspective: 1000px;
}
.hero-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.hero-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(43, 33, 24, 0.55) 0%, rgba(43, 33, 24, 0.35) 40%, rgba(251, 247, 241, 0.85) 100%);
}
.hero-bg img {
  width: 100%; height: 100%;
  object-fit: cover;
  will-change: transform;
}
.hero-content {
  position: relative;
  z-index: 1;
  text-align: center;
  max-width: 760px;
}
.hero-logo {
  width: 120px;
  margin: 0 auto 24px;
  border-radius: 50%;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  will-change: transform;
  opacity: 0;
}
@media (max-width: 768px) { .hero-logo { width: 90px; } }

/* === EYEBROW === */
.hero-eyebrow {
  font-family: var(--sans);
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--accent2);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  opacity: 0;
}
.hero-eyebrow::before {
  content: '';
  width: 40px; height: 2px;
  background: var(--accent2);
}

/* === H1 TEXT === */
.hero h1 {
  font-size: clamp(2.2rem, 6vw, 3.75rem);
  color: #fff;
  margin-bottom: 12px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  letter-spacing: 0.02em;
  perspective: 600px;
  cursor: default;
}
.hero h1 .accent-text {
  color: var(--accent2);
  text-shadow: 0 2px 12px rgba(0,0,0,0.6), 0 0 30px rgba(196, 163, 90, 0.4);
  position: relative;
  display: inline-block;
}

/* === CHAR WRAPPERS === */
.char {
  display: inline-block;
  will-change: transform, opacity, filter;
  transform-style: preserve-3d;
}
.char-wrap {
  display: inline-block;
  overflow: hidden;
  vertical-align: top;
  padding-bottom: 0.1em;
}

/* === SUBTITLE === */
.hero-subtitle {
  font-size: clamp(1rem, 2vw, 1.2rem);
  color: rgba(255, 255, 255, 0.88);
  margin-bottom: 36px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
  text-shadow: 0 1px 8px rgba(0,0,0,0.3);
  opacity: 0;
}
.sub-word {
  display: inline-block;
  will-change: transform, opacity;
}

/* === ACTIONS === */
.hero-actions {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
  opacity: 0;
}
.hero-actions .btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 36px;
  border-radius: 50px;
  font-family: var(--sans);
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1),
              box-shadow 0.4s cubic-bezier(0.32, 0.72, 0, 1),
              background-color 0.3s ease;
  cursor: pointer;
  border: none;
}
.hero-actions .btn-primary {
  background: var(--accent);
  color: #fff;
}
.hero-actions .btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 32px rgba(155, 45, 32, 0.35);
  background: #b53828;
}
.hero-actions .btn:active {
  transform: scale(0.97);
}
.hero-actions .btn-arrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  font-size: 0.85rem;
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
}
.hero-actions .btn-primary:hover .btn-arrow {
  transform: translateX(4px);
}

/* === STATS === */
.hero-stats {
  display: flex;
  gap: 40px;
  justify-content: center;
  margin-top: 48px;
  flex-wrap: wrap;
  opacity: 0;
}
.hero-stat .num {
  font-family: var(--serif);
  font-size: clamp(2rem, 4vw, 2.75rem);
  color: var(--accent2);
  text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  line-height: 1;
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
}
.hero-stat:hover .num {
  transform: scale(1.08);
}
.hero-stat .label {
  font-size: 0.82rem;
  color: rgba(255,255,255,0.7);
  margin-top: 4px;
}
@media (max-width: 768px) {
  .hero-stats { gap: 24px; }
}

/* === SCROLL HINT === */
.scroll-hint {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: rgba(255,255,255,0.5);
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 0.3s ease;
  opacity: 0;
}
.scroll-hint:hover {
  color: rgba(255,255,255,0.8);
}
.scroll-hint .arrow-down {
  width: 20px; height: 28px;
  border: 2px solid currentColor;
  border-radius: 12px;
  position: relative;
}
.scroll-hint .arrow-down::after {
  content: '';
  position: absolute;
  top: 6px; left: 50%;
  transform: translateX(-50%);
  width: 4px; height: 6px;
  background: currentColor;
  border-radius: 2px;
  animation: scrollDot 1.8s ease-in-out infinite;
}
@keyframes scrollDot {
  0%, 100% { top: 6px; opacity: 1; }
  50% { top: 14px; opacity: 0.3; }
}

/* === FLOATING LOGO === */
@keyframes floatY {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* === INK WASH DECORATION === */
.ink-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
  opacity: 0.15;
}
.ink-blob-1 {
  width: 300px; height: 300px;
  background: var(--accent2);
  top: 10%; left: -5%;
  animation: blobFloat1 12s ease-in-out infinite;
}
.ink-blob-2 {
  width: 250px; height: 250px;
  background: var(--accent);
  bottom: 15%; right: -3%;
  animation: blobFloat2 14s ease-in-out infinite;
}
@keyframes blobFloat1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(40px, -30px) scale(1.1); }
}
@keyframes blobFloat2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-30px, 40px) scale(0.9); }
}

@media (prefers-reduced-motion: reduce) {
  .hero-content > * { opacity: 1; }
  .hero-logo { opacity: 1; animation: none; }
  .hero-eyebrow { opacity: 1; }
  .hero-subtitle { opacity: 1; }
  .hero-actions { opacity: 1; }
  .hero-stats { opacity: 1; }
  .scroll-hint { opacity: 1; }
  .scroll-hint .arrow-down::after { animation: none; }
  .accent-text::after { display: none; }
}
</style>
</head>
<body>

<section class="hero" id="hero">
  <div class="hero-bg">
    <img src="assets/hero_1024x576.jpg" alt="传统文化与数字技术融合">
  </div>
  <div class="ink-blob ink-blob-1"></div>
  <div class="ink-blob ink-blob-2"></div>
  <div class="container">
    <div class="hero-content">
      <img src="assets/logo.jpg" alt="文绎新堂 Logo" class="hero-logo">
      <div class="hero-eyebrow">课文双端 · 数字实践</div>
      <h1>文绎新堂<br><span class="accent-text" id="accentText">课文双端数字实践项目</span></h1>
      <p class="hero-subtitle" id="subtitle">
        高校新文科跨专业学生实践团队，坚持人文考据为先、AI 技术赋能，面向中小学美育、县域文博文旅、青年新媒体传播三大场景，开展传统文化数字化实践。
      </p>
      <div class="hero-actions">
        <a href="detail.html" class="btn btn-primary">
          查看详情
          <span class="btn-arrow">→</span>
        </a>
      </div>
      <div class="hero-stats">
        <div class="hero-stat">
          <div class="num" data-target="3">0</div>
          <div class="label">核心业务板块</div>
        </div>
        <div class="hero-stat">
          <div class="num" data-target="3">0</div>
          <div class="label">级标准化质控流程</div>
        </div>
        <div class="hero-stat">
          <div class="num" data-target="3" data-suffix="+">0</div>
          <div class="label">大场景覆盖</div>
        </div>
      </div>
    </div>
  </div>
  <a href="detail.html" class="scroll-hint">
    <span>向下探索</span>
    <div class="arrow-down"></div>
  </a>
</section>

<!-- GSAP -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(function() {
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // === MANUALLY SPLIT H1 INTO CHARACTERS ===
  var accentEl = document.getElementById('accentText');
  var accentText = accentEl.textContent;
  accentEl.innerHTML = '';
  var accentChars = [];
  for (var i = 0; i < accentText.length; i++) {
    var char = accentText[i];
    var wrap = document.createElement('span');
    wrap.className = 'char-wrap';
    var span = document.createElement('span');
    span.className = 'char';
    span.textContent = char;
    wrap.appendChild(span);
    accentEl.appendChild(wrap);
    accentChars.push(span);
  }

  // Also split the first line "文绎新堂"
  var h1 = document.querySelector('.hero h1');
  var firstLine = h1.firstChild;
  if (firstLine && firstLine.nodeType === 3) {
    var firstText = firstLine.textContent;
    h1.removeChild(firstLine);
    var frag = document.createDocumentFragment();
    var firstChars = [];
    for (var j = 0; j < firstText.length; j++) {
      var w = document.createElement('span');
      w.className = 'char-wrap';
      var s = document.createElement('span');
      s.className = 'char';
      s.textContent = firstText[j];
      s.style.color = '#fff';
      s.style.textShadow = '0 2px 20px rgba(0,0,0,0.5)';
      w.appendChild(s);
      frag.appendChild(w);
      firstChars.push(s);
    }
    frag.appendChild(document.createElement('br'));
    h1.insertBefore(frag, h1.firstChild);
  }

  var allChars = document.querySelectorAll('.hero h1 .char');

  // === SPLIT SUBTITLE INTO WORDS ===
  var subEl = document.getElementById('subtitle');
  var subText = subEl.textContent.trim();
  var subPunct = subText.split('');
  subEl.innerHTML = '';
  var subWords = [];
  var currentWord = '';
  var wordSpans = [];
  for (var k = 0; k < subPunct.length; k++) {
    var ch = subPunct[k];
    if (ch === '，' || ch === '。' || ch === '、' || ch === ' ' || ch === '；') {
      if (currentWord) {
        var ws = document.createElement('span');
        ws.className = 'sub-word';
        ws.textContent = currentWord;
        subEl.appendChild(ws);
        wordSpans.push(ws);
        currentWord = '';
      }
      var ps = document.createElement('span');
      ps.className = 'sub-word';
      ps.textContent = ch;
      subEl.appendChild(ps);
      wordSpans.push(ps);
    } else {
      currentWord += ch;
    }
  }
  if (currentWord) {
    var fws = document.createElement('span');
    fws.className = 'sub-word';
    fws.textContent = currentWord;
    subEl.appendChild(fws);
    wordSpans.push(fws);
  }

  // === ENTRANCE TIMELINE ===
  if (!reduceMotion) {
    // Logo float
    document.querySelector('.hero-logo').style.animation = 'floatY 4s ease-in-out 1.5s infinite';

    var tl = gsap.timeline({ delay: 0.3 });

    // Logo entrance
    tl.to('.hero-logo', {
      opacity: 1,
      duration: 1,
      ease: 'power3.out'
    });

    // Eyebrow letter-spacing + opacity
    tl.fromTo('.hero-eyebrow', 
      { opacity: 0, letterSpacing: '0.6em' },
      { opacity: 1, letterSpacing: '0.25em', duration: 0.8, ease: 'power2.out' },
      '-=0.5'
    );

    // H1 chars: 3D rotateX + translateY + opacity + blur
    tl.from(allChars, {
      opacity: 0,
      y: 60,
      rotateX: -90,
      filter: 'blur(10px)',
      stagger: { each: 0.05, from: 'start' },
      duration: 0.9,
      ease: 'power3.out'
    }, '-=0.3');

    // Subtitle words: fade up
    tl.from(wordSpans, {
      opacity: 0,
      y: 20,
      filter: 'blur(6px)',
      stagger: 0.03,
      duration: 0.5,
      ease: 'power2.out'
    }, '-=0.4');

    // Subtitle container opacity
    tl.to('.hero-subtitle', {
      opacity: 1,
      duration: 0.1
    }, '-=0.5');

    // Actions
    tl.fromTo('.hero-actions',
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' },
      '-=0.3'
    );

    // Stats
    tl.fromTo('.hero-stats',
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' },
      '-=0.2'
    );

    // Scroll hint
    tl.to('.scroll-hint', {
      opacity: 1,
      duration: 0.5,
      ease: 'power2.out'
    }, '-=0.1');

    // === STATS COUNTER ===
    tl.add(function() {
      document.querySelectorAll('.hero-stat .num').forEach(function(numEl) {
        var target = parseInt(numEl.getAttribute('data-target'));
        var suffix = numEl.getAttribute('data-suffix') || '';
        var obj = { val: 0 };
        gsap.to(obj, {
          val: target,
          duration: 1.2,
          ease: 'power2.out',
          onUpdate: function() {
            numEl.textContent = Math.round(obj.val) + suffix;
          }
        });
      });
    }, '-=0.3');

  } else {
    // Reduced motion: show everything
    gsap.set('.hero-logo', { opacity: 1 });
    gsap.set('.hero-eyebrow', { opacity: 1 });
    gsap.set('.hero-subtitle', { opacity: 1 });
    gsap.set('.hero-actions', { opacity: 1 });
    gsap.set('.hero-stats', { opacity: 1 });
    gsap.set('.scroll-hint', { opacity: 1 });
    gsap.set(allChars, { opacity: 1 });
    gsap.set(wordSpans, { opacity: 1 });
    // Set stat numbers to final values
    document.querySelectorAll('.hero-stat .num').forEach(function(numEl) {
      var target = numEl.getAttribute('data-target');
      var suffix = numEl.getAttribute('data-suffix') || '';
      numEl.textContent = target + suffix;
    });
  }

  // === MOUSE PARALLAX ON CHARS ===
  if (!reduceMotion) {
    var hero = document.querySelector('.hero');
    var mouseX = 0, mouseY = 0;
    var centerX = 0, centerY = 0;
    var charsArray = Array.prototype.slice.call(allChars);

    hero.addEventListener('mousemove', function(e) {
      var rect = hero.getBoundingClientRect();
      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;
      centerX = rect.width / 2;
      centerY = rect.height / 2;

      var dxRatio = (mouseX - centerX) / centerX;
      var dyRatio = (mouseY - centerY) / centerY;

      charsArray.forEach(function(char, i) {
        var charRect = char.getBoundingClientRect();
        var charCx = charRect.left + charRect.width / 2 - rect.left;
        var charCy = charRect.top + charRect.height / 2 - rect.top;

        var distX = (charCx - mouseX) / centerX;
        var distY = (charCy - mouseY) / centerY;
        var dist = Math.sqrt(distX * distX + distY * distY);
        var intensity = Math.max(0, 1 - dist * 0.8);

        var moveX = dxRatio * intensity * 8;
        var moveY = dyRatio * intensity * 8;

        gsap.to(char, {
          x: moveX,
          y: moveY,
          duration: 0.6,
          ease: 'power2.out',
          overwrite: 'auto'
        });
      });

      // Also move logo slightly
      gsap.to('.hero-logo', {
        x: dxRatio * 12,
        y: dyRatio * 12,
        duration: 0.8,
        ease: 'power2.out',
        overwrite: 'auto'
      });

      // Move ink blobs
      gsap.to('.ink-blob-1', {
        x: dxRatio * 30,
        y: dyRatio * 30,
        duration: 1,
        ease: 'power2.out',
        overwrite: 'auto'
      });
      gsap.to('.ink-blob-2', {
        x: dxRatio * -25,
        y: dyRatio * -25,
        duration: 1,
        ease: 'power2.out',
        overwrite: 'auto'
      });
    });

    // Reset on mouse leave
    hero.addEventListener('mouseleave', function() {
      charsArray.forEach(function(char) {
        gsap.to(char, {
          x: 0,
          y: 0,
          duration: 0.8,
          ease: 'power3.out',
          overwrite: 'auto'
        });
      });
      gsap.to('.hero-logo', { x: 0, y: 0, duration: 0.8, ease: 'power3.out' });
      gsap.to('.ink-blob-1', { x: 0, y: 0, duration: 1, ease: 'power3.out' });
      gsap.to('.ink-blob-2', { x: 0, y: 0, duration: 1, ease: 'power3.out' });
    });
  }

  // === HOVER WAVE: chars rise sequentially when hovering H1 ===
  if (!reduceMotion) {
    var h1El = document.querySelector('.hero h1');
    var waveActive = false;

    h1El.addEventListener('mouseenter', function() {
      if (waveActive) return;
      waveActive = true;
      charsArray.forEach(function(char, i) {
        gsap.to(char, {
          y: -12,
          duration: 0.35,
          delay: i * 0.04,
          ease: 'power2.out',
          overwrite: 'auto'
        });
      });
    });

    h1El.addEventListener('mouseleave', function() {
      waveActive = false;
      charsArray.forEach(function(char, i) {
        gsap.to(char, {
          y: 0,
          duration: 0.5,
          delay: i * 0.03,
          ease: 'elastic.out(1, 0.4)',
          overwrite: 'auto'
        });
      });
    });
  }

})();
</script>

</body>
</html>
