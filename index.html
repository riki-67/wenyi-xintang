<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文绎新堂——课文双端数字实践项目</title>
<meta name="description" content="文绎新堂——课文双端数字实践项目：高校新文科跨专业学生实践团队，坚持人文考据为先、AI技术赋能，面向中小学美育、县域文博文旅、青年新媒体传播三大场景开展传统文化数字化实践。">
<style>
@font-face {
  font-family: 'InstrumentSerif';
  src: url('./_shared/fonts/InstrumentSerif-Regular.ttf') format('truetype');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'InstrumentSerif';
  src: url('./_shared/fonts/InstrumentSerif-Italic.ttf') format('truetype');
  font-weight: 400;
  font-style: italic;
  font-display: swap;
}
@font-face {
  font-family: 'InstrumentSans';
  src: url('./_shared/fonts/InstrumentSans-Regular.ttf') format('truetype');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'InstrumentSans';
  src: url('./_shared/fonts/InstrumentSans-Bold.ttf') format('truetype');
  font-weight: 700;
  font-display: swap;
}
@font-face {
  font-family: 'CrimsonPro';
  src: url('./_shared/fonts/CrimsonPro-Regular.ttf') format('truetype');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'CrimsonPro';
  src: url('./_shared/fonts/CrimsonPro-Bold.ttf') format('truetype');
  font-weight: 700;
  font-display: swap;
}

:root {
  --bg: #FBF7F1;
  --bg2: #F4EDE0;
  --ink: #2B2118;
  --muted: #8B7B6A;
  --rule: #E0D5C2;
  --accent: #9B2D20;
  --accent2: #C4A35A;
  --accent-light: rgba(155, 45, 32, 0.08);
  --gold-light: rgba(196, 163, 90, 0.12);
  --serif: 'InstrumentSerif', 'Songti SC', 'STSong', 'Noto Serif SC', serif;
  --serif-alt: 'CrimsonPro', 'Songti SC', 'STSong', 'Noto Serif SC', serif;
  --sans: 'InstrumentSans', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --shadow: 0 4px 24px rgba(43, 33, 24, 0.06);
  --shadow-lg: 0 8px 40px rgba(43, 33, 24, 0.10);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  overflow-x: hidden;
}
img { max-width: 100%; height: auto; display: block; }
a { color: var(--accent); text-decoration: none; }
ul { list-style: none; }
.container { max-width: 1140px; margin: 0 auto; padding: 0 24px; }

h1, h2, h3, h4 { font-family: var(--serif); font-weight: 400; line-height: 1.25; }
p { font-size: 1rem; color: var(--ink); }

/* === HERO === */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 80px 0 60px;
}
.hero-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.hero-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(43, 33, 24, 0.55) 0%, rgba(43, 33, 24, 0.35) 40%, rgba(251, 247, 241, 0.85) 100%);
}
.hero-bg img {
  width: 100%; height: 100%;
  object-fit: cover;
  will-change: transform;
}
.hero-content {
  position: relative;
  z-index: 1;
  text-align: center;
  max-width: 760px;
}
.hero-logo {
  width: 120px;
  margin: 0 auto 24px;
  border-radius: 50%;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  will-change: transform;
}
@media (max-width: 768px) { .hero-logo { width: 90px; } }
.hero-eyebrow {
  font-family: var(--sans);
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--accent2);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.hero-eyebrow::before {
  content: '';
  width: 40px; height: 2px;
  background: var(--accent2);
}
.hero h1 {
  font-size: clamp(2.2rem, 6vw, 3.75rem);
  color: #fff;
  margin-bottom: 24px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  letter-spacing: 0.02em;
}
.hero h1 .accent-text {
  color: var(--accent2);
  text-shadow: 0 2px 12px rgba(0,0,0,0.6), 0 0 30px rgba(196, 163, 90, 0.4);
}
.hero-subtitle {
  font-size: clamp(1rem, 2vw, 1.2rem);
  color: rgba(255, 255, 255, 0.88);
  margin-bottom: 36px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
  text-shadow: 0 1px 8px rgba(0,0,0,0.3);
}
.hero-actions {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
}
.hero-actions .btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 36px;
  border-radius: 50px;
  font-family: var(--sans);
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1),
              box-shadow 0.4s cubic-bezier(0.32, 0.72, 0, 1),
              background-color 0.3s ease;
  cursor: pointer;
  border: none;
}
.hero-actions .btn-primary {
  background: var(--accent);
  color: #fff;
}
.hero-actions .btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 32px rgba(155, 45, 32, 0.35);
  background: #b53828;
}
.hero-actions .btn:active {
  transform: scale(0.97);
}
.hero-actions .btn-arrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  font-size: 0.85rem;
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
}
.hero-actions .btn-primary:hover .btn-arrow {
  transform: translateX(4px);
}
.hero-stats {
  display: flex;
  gap: 40px;
  justify-content: center;
  margin-top: 48px;
  flex-wrap: wrap;
}
.hero-stat .num {
  font-family: var(--serif);
  font-size: clamp(2rem, 4vw, 2.75rem);
  color: var(--accent2);
  text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  line-height: 1;
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
}
.hero-stat:hover .num {
  transform: scale(1.08);
}
.hero-stat .label {
  font-size: 0.82rem;
  color: rgba(255,255,255,0.7);
  margin-top: 4px;
}
@media (max-width: 768px) {
  .hero-stats { gap: 24px; }
}

/* === SCROLL HINT === */
.scroll-hint {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: rgba(255,255,255,0.5);
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 0.3s ease;
}
.scroll-hint:hover {
  color: rgba(255,255,255,0.8);
}
.scroll-hint .arrow-down {
  width: 20px; height: 28px;
  border: 2px solid currentColor;
  border-radius: 12px;
  position: relative;
}
.scroll-hint .arrow-down::after {
  content: '';
  position: absolute;
  top: 6px; left: 50%;
  transform: translateX(-50%);
  width: 4px; height: 6px;
  background: currentColor;
  border-radius: 2px;
  animation: scrollDot 1.8s ease-in-out infinite;
}
@keyframes scrollDot {
  0%, 100% { top: 6px; opacity: 1; }
  50% { top: 14px; opacity: 0.3; }
}

/* === HERO ENTRANCE === */
.hero-content > * { opacity: 0; }

/* === FLOATING LOGO === */
@keyframes floatY {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.hero-logo { animation: floatY 4s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  .hero-content > * { opacity: 1; }
  .hero-logo { animation: none; }
  .scroll-hint .arrow-down::after { animation: none; }
}
</style>
</head>
<body>

<section class="hero" id="hero">
  <div class="hero-bg">
    <img src="assets/hero_1024x576.jpg" alt="传统文化与数字技术融合">
  </div>
  <div class="container">
    <div class="hero-content">
      <img src="assets/logo.jpg" alt="文绎新堂 Logo" class="hero-logo">
      <div class="hero-eyebrow">课文双端 · 数字实践</div>
      <h1>文绎新堂<br><span class="accent-text">课文双端数字实践项目</span></h1>
      <p class="hero-subtitle">
        高校新文科跨专业学生实践团队，坚持人文考据为先、AI 技术赋能，面向中小学美育、县域文博文旅、青年新媒体传播三大场景，开展传统文化数字化实践。
      </p>
      <div class="hero-actions">
        <a href="detail.html" class="btn btn-primary">
          查看详情
          <span class="btn-arrow">→</span>
        </a>
      </div>
      <div class="hero-stats">
        <div class="hero-stat">
          <div class="num">3</div>
          <div class="label">核心业务板块</div>
        </div>
        <div class="hero-stat">
          <div class="num">3</div>
          <div class="label">级标准化质控流程</div>
        </div>
        <div class="hero-stat">
          <div class="num">3+</div>
          <div class="label">大场景覆盖</div>
        </div>
      </div>
    </div>
  </div>
  <a href="detail.html" class="scroll-hint">
    <span>向下探索</span>
    <div class="arrow-down"></div>
  </a>
</section>

<!-- GSAP -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(function() {
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!reduceMotion) {
    var tl = gsap.timeline({ delay: 0.3 });
    tl
      .to('.hero-logo', { opacity: 1, duration: 1, ease: 'power3.out' })
      .to('.hero-eyebrow', { opacity: 1, duration: 0.6, ease: 'power2.out' }, '-=0.5')
      .to('.hero h1', { opacity: 1, duration: 1, ease: 'power3.out' }, '-=0.3')
      .to('.hero-subtitle', { opacity: 1, duration: 0.7, ease: 'power2.out' }, '-=0.5')
      .to('.hero-actions', { opacity: 1, duration: 0.6, ease: 'power2.out' }, '-=0.3')
      .to('.hero-stats', { opacity: 1, duration: 0.6, ease: 'power2.out' }, '-=0.2')
      .to('.scroll-hint', { opacity: 1, duration: 0.5, ease: 'power2.out' }, '-=0.1');
  } else {
    gsap.set('.hero-content > *', { opacity: 1 });
    gsap.set('.scroll-hint', { opacity: 1 });
  }
})();
</script>

</body>
</html>
